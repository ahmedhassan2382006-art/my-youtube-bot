name: Run Telegram Media Downloader Bot

on:
  schedule:
    # إعادة تشغيل البوت تلقائياً كل 5 ساعات لضمان العمل المستمر
    - cron: '0 */5 * * *'
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: telegram-media-downloader-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # تنظيف وإغلاق أي جلسات قديمة
      - name: Cancel all other running workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for run_id in $(gh run list --repo "$GITHUB_REPOSITORY" --status in_progress --json databaseId -q '.[].databaseId'); do
            if [ "$run_id" != "$GITHUB_RUN_ID" ]; then
              echo "إيقاف الجلسة: $run_id"
              gh run cancel "$run_id" --repo "$GITHUB_REPOSITORY" || true
            fi
          done
          for run_id in $(gh run list --repo "$GITHUB_REPOSITORY" --status queued --json databaseId -q '.[].databaseId'); do
            if [ "$run_id" != "$GITHUB_RUN_ID" ]; then
              gh run cancel "$run_id" --repo "$GITHUB_REPOSITORY" || true
            fi
          done
          sleep 3

      # تثبيت أداة FFmpeg لدمج الصوت مع الفيديو
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      # تثبيت بايثون وتفعيل الكاش للمكتبات
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      # تثبيت المكتبات وتحديث yt-dlp دورياً
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --upgrade yt-dlp

      # تشغيل البوت
      - name: Run Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python bot.py